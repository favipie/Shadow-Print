[project]
name = "shadowprint-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "SHADOWPRINT investigation API backed by the verified SQL Server schema"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "pyodbc>=5.2,<6",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated seeded SQL Server test database"]

[tool.ruff]
line-length = 100
