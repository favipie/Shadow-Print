[project]
name = "shadowprint-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "SHADOWPRINT investigation API backed by the verified SQL Server schema"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated seeded SQL Server test database"]

[tool.ruff]
line-length = 100
